name: Native model-free video skill evaluation
on:
  push:
    branches: [test/model-free-skills]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xianyu:
    name: xianyu-${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        mode: [offline, voice]
    env:
      SOURCE_SHA: 96c49b349b7d975bda8f05ce6669c1d33500c269
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: xianyu110/ecommerce-video-skills
          ref: 96c49b349b7d975bda8f05ce6669c1d33500c269
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install documented render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install pillow==13.0.0 numpy==2.5.4 edge-tts==7.3.1
          mkdir -p upstream/out
          python -m pip freeze > upstream/out/python-dependencies.txt
          ffmpeg -version > upstream/out/ffmpeg-version.txt
          test "$(git -C upstream rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Native full render on public fictional bottle example
        working-directory: upstream
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -o pipefail
          if [ "$MODE" = offline ]; then
            timeout 720 python scripts/assemble.py examples/aura-bottle/storyboard.json --tts none -o out/aura-offline.mp4 2>&1 | tee out/render.log
          else
            timeout 720 python scripts/assemble.py examples/aura-bottle/storyboard.json --lang en --voice en-US-AndrewNeural -o out/aura-voice.mp4 2>&1 | tee out/render.log
          fi
      - name: Verify actual encode and corrupt-output rejection
        working-directory: upstream
        run: python ../ci/verify_render.py '${{ matrix.mode }}'
      - name: Native gallery for visual review
        working-directory: upstream
        run: python scripts/preview.py 'out/aura-${{ matrix.mode }}.mp4' --gallery out/gallery.jpg --frames 6
      - name: Preserve media and raw receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xianyu-${{ matrix.mode }}-${{ github.sha }}
          path: |
            upstream/out/
            upstream/build/timing.json
            upstream/build/subs.ass
          retention-days: 7
          if-no-files-found: error
  iart:
    name: iart-documented-ffmpeg-example
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: 2bd0dd19c9b2df5230f5d8f7453861b9681e49b4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: iart-ai/ecommerce-video-skills
          ref: 2bd0dd19c9b2df5230f5d8f7453861b9681e49b4
          path: upstream
          persist-credentials: false
      - name: Documented native FFmpeg example with synthetic calibration fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          test "$(git -C upstream rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p out
          ffmpeg -y -v error -f lavfi -i testsrc2=size=1920x1080:rate=1 -frames:v 1 photo.png
          ffmpeg -y -v error -loop 1 -i photo.png -t 5 -r 30 -filter_complex "scale=8000:-1,zoompan=z='min(zoom+0.0008,1.10)':d=150:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1920x1080:fps=30" -c:v libx264 -pix_fmt yuv420p out/iart-kenburns.mp4
          bash upstream/scripts/probe-mp4.sh out/iart-kenburns.mp4 1920x1080 30 | tee out/upstream-probe.log
          if bash upstream/scripts/probe-mp4.sh out/iart-kenburns.mp4 1080x1920 30 > out/upstream-red-probe.log 2>&1; then exit 1; fi
          python3 ci/verify_render.py iart
          ffmpeg -y -v error -ss 2 -i out/iart-kenburns.mp4 -frames:v 1 out/still.png
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iart-ffmpeg-${{ github.sha }}
          path: out/
          retention-days: 7
          if-no-files-found: error
