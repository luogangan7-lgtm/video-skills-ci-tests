name: Factory sync acceptance
on:
  push:
    branches: [fix/factory-lipsync-20261024]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '60'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TMElyralab/MuseTalk
          ref: 0a89dec45a0192b824e3cf4daf96c239440c5ed8
          path: musetalk-upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Install CPU evaluation dependencies
        timeout-minutes: 8
        run: |
          if ! command -v ffmpeg >/dev/null; then
            timeout 90 sudo apt-get -o Acquire::Retries=1 update -qq
            timeout 90 sudo apt-get -o Acquire::Retries=1 install -y -qq --no-install-recommends ffmpeg
          fi
          python -m pip install --timeout 30 --retries 1 torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --timeout 30 --retries 1 pillow==11.1.0 numpy==1.26.4 diffusers==0.30.2 transformers==4.39.2 huggingface-hub==0.30.2 librosa==0.11.0 einops==0.8.1 opencv-python-headless==4.9.0.80 omegaconf==2.3.0 soundfile==0.12.1
      - name: Wait for the registered immutable generation run
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout 1740 gh run watch 40081026748 --repo luogangan7-lgtm/video-skills-ci-tests --interval 60 --exit-status
      - name: Import exact GitHub-generated candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: luogangan7-lgtm/video-skills-ci-tests
          run-id: 40081026748
          name: factory-lipsync-a012a877ae13c58a170c70df9dffa261066a930b
          path: factory-presenter
      - name: Check provenance and extract delivered evaluation audio
        run: python factory-presenter/ci/verify_candidate.py
      - name: Compare actual sync and shifted negative controls
        timeout-minutes: 15
        run: |
          set -o pipefail
          timeout 840 python factory-presenter/ci/sync_gate.py 2>&1 | tee factory-presenter/out/sync-evaluation.log
      - name: Preserve evaluated media and exact receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factory-sync-accepted-${{ github.sha }}
          path: |
            factory-presenter/out/
            factory-presenter/build/timing.json
            factory-presenter/build/subs.ass
          retention-days: 7
          if-no-files-found: error
