name: Factory presenter skill test
on:
  push:
    branches: [test/factory-presenter, cleanup/factory-test-media-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ecommerce:
    # Retired by the user; generated test media have been removed.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SOURCE_SHA: 96c49b349b7d975bda8f05ce6669c1d33500c269
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: xianyu110/ecommerce-video-skills
          ref: 96c49b349b7d975bda8f05ce6669c1d33500c269
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install render dependencies on CI runner
        timeout-minutes: 4
        run: |
          if ! command -v ffmpeg >/dev/null || ! test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; then
            timeout 90 sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 update -qq
            timeout 90 sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
          fi
          python -m pip install --timeout 30 --retries 1 pillow==13.0.0 numpy==2.5.4 edge-tts==7.3.1
          mkdir -p factory-presenter/out
          python -m pip freeze > factory-presenter/out/dependencies.txt
          test "$(git -C upstream rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Verify handheld source and prepare native storyboard on CI
        run: python factory-presenter/ci/prepare.py
      - name: Run unchanged upstream native assembler
        run: |
          set -o pipefail
          timeout 600 python upstream/scripts/assemble.py factory-presenter/storyboard.json --size 1920x1080 --font 'DejaVu Sans' --build factory-presenter/build -o factory-presenter/out/factory-presenter.mp4 2>&1 | tee factory-presenter/out/render.log
      - name: Actual output checks and red to green mutations
        run: python factory-presenter/ci/verify.py
      - name: Preserve exact exported media and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factory-presenter-${{ github.sha }}
          path: |
            factory-presenter/out/
            factory-presenter/build/timing.json
            factory-presenter/build/subs.ass
            factory-presenter/storyboard.json
          retention-days: 7
          if-no-files-found: error
  cleanup-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify retired media absent and protected sources unchanged
        shell: python
        run: |
          import json, os, subprocess
          base = '3a83ce97d640d2d7672d3d84f77590584436c3b5'
          media = {'factory-presenter/assets/' + name for name in (
              'presenter-01.mp4', 'presenter-anchor.png', 'presenter-fixed.mp4',
              'presenter-handheld-anchor.png', 'presenter-handheld.mp4')}
          allowed = media | {'.github/workflows/factory-presenter.yml', 'factory-presenter/README.md'}
          def tree(ref):
              raw = subprocess.check_output(['git', 'ls-tree', '-r', '-z', ref]).decode()
              return {row.split('\t', 1)[1]: row.split('\t', 1)[0] for row in raw.split('\0') if row}
          before, after = tree(base), tree('HEAD')
          assert media <= before.keys(), 'Expected old-media negative control missing'
          assert not media.isdisjoint(before), 'Negative control must reject original tree'
          print('RED control: original tree rejected because retired media exist')
          assert media.isdisjoint(after), 'Retired generated media returned'
          changed = {name for name in before.keys() | after.keys() if before.get(name) != after.get(name)}
          assert changed == allowed, sorted(changed ^ allowed)
          assert all(before[name] == after.get(name) for name in before.keys() - allowed)
          workflow = open('.github/workflows/factory-presenter.yml').read()
          assert 'if: ${{ false }}' in workflow, 'Retired render job is enabled'
          print(json.dumps({'status': 'PASS', 'sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'removed_media': sorted(media), 'protected_blobs_unchanged': True, 'render_job': 'disabled'}))
